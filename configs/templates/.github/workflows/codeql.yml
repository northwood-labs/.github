---
# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

# @config-manager:start workflow-name
name: "CodeQL"
# @config-manager:end workflow-name

# @config-manager:start workflow-on
on:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    # https://crontab.guru/#0_0_*_*_1
    - cron: "0 0 * * 1"
# @config-manager:end workflow-on

# @config-manager:start workflow-permissions
permissions:
  contents: read
# @config-manager:end workflow-permissions

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # @config-manager:start workflow-permissions-job
      actions: read
      contents: read
      security-events: write
      # @config-manager:end workflow-permissions-job
    strategy:
      # @config-manager:start workflow-strategy
      fail-fast: false
      # @config-manager:end workflow-strategy
      matrix:
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
        language: ["go"]

    steps:
      # @config-manager:start workflow-codeql
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          upload: never

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{matrix.language}}"
      # @config-manager:end workflow-codeql
