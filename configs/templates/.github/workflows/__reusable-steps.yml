# @config-manager:start workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# @config-manager:end workflow-concurrency

jobs:
  name:
    steps:
      # @config-manager:start harden-runner
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      # @config-manager:end harden-runner

      # @config-manager:start workflow-clone
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # @config-manager:end workflow-clone
          # @config-manager:start workflow-clone-fetch-all
          fetch: 0
      # @config-manager:end workflow-clone-fetch-all
      # @config-manager:start workflow-https-pat
      ##
      # Replace me with:
      #
      #   github-app-token (+ with)
      #   github-app-userid
      #   github-app-git-config
      ##
      - run: exit 1
      # @config-manager:end workflow-https-pat
      # @config-manager:start github-app-token
      - name: Fetch temporary app token for job
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: gh_token
        # @config-manager:end github-app-token

      # @config-manager:start github-app-userid
      - name: Get GitHub App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.gh_token.outputs.token }}
          STEPS_GH_TOKEN_OUTPUTS_APP_SLUG: ${{ steps.gh_token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${STEPS_GH_TOKEN_OUTPUTS_APP_SLUG}[bot]" --jq .id)
          echo "user-id=${USER_ID}" >> "$GITHUB_OUTPUT"
      # @config-manager:end github-app-userid

      # @config-manager:start github-app-git-config
      - name: Set Git config
        env:
          GH_TOKEN: ${{ steps.gh_token.outputs.token }}
          STEPS_GH_TOKEN_OUTPUTS_APP_SLUG: ${{ steps.gh_token.outputs.app-slug }}
          STEPS_GET_USER_ID_OUTPUTS_USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

          git config --global advice.detachedHead false

          USERNAME="${STEPS_GH_TOKEN_OUTPUTS_APP_SLUG}[bot]"
          git config --global user.name "${USERNAME}"

          USER_EMAIL="${STEPS_GET_USER_ID_OUTPUTS_USER_ID}+${STEPS_GH_TOKEN_OUTPUTS_APP_SLUG}[bot]@users.noreply.github.com"
          git config --global user.email "${USER_EMAIL}"

          gh auth setup-git
      # @config-manager:end github-app-git-config

      # @config-manager:start workflow-dependency-review
      - name: "Dependency Review"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: true
          vulnerability-check: true
          comment-summary-in-pr: on-failure
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, MIT
      # @config-manager:end workflow-dependency-review

      # @config-manager:start workflow-app-token
      - name: Fetch temporary app token for job
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: gh_token
        with:
          client-id: ${{ vars.SECRET_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.SECRET_SYNC_PRIVATE_KEY }}
          owner: northwood-labs
          repositories: org-secret-list
          permission-organization-secrets: write
          permission-secrets: write
      # @config-manager:end workflow-app-token
