---
# @config-manager:start workflow-name
name: TruffleHog
# @config-manager:end workflow-name

# @config-manager:start workflow-on
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - main
# @config-manager:end workflow-on

# @config-manager:start workflow-permissions
permissions:
  contents: read
# @config-manager:end workflow-permissions

jobs:
  literally_anything:
    strategy:
      # @config-manager:start workflow-strategy
      fail-fast: false
      # @config-manager:end workflow-strategy
    steps:
      # @config-manager:start workflow-trufflehog-scan
      - name: Check secrets with TruffleHog OSS
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          head: HEAD
          extra_args: --only-verified
      # @config-manager:end workflow-trufflehog-scan
