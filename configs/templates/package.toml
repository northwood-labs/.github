##
# Generate with:
#   tomljson package.toml > package.json
##

name = '@TODO: Name of the npm package.'
private = true
type = 'module'

[alias]
  # @config-manager:start alias
  react = 'preact/compat'
  react-dom = 'preact/compat'
  'react-dom/test-utils' = 'preact/test-utils'
  'react/jsx-runtime' = 'preact/jsx-runtime'
  # @config-manager:end alias

[dependencies]
  # @config-manager:start dependencies
  # @config-manager:end dependencies

[devDependencies]
  # @config-manager:start dev_dependencies
  '@preact/preset-vite' = '2.10.5'
  '@tailwindcss/vite' = '4.3.2'
  '@tsconfig/bun' = '1.0.10'
  '@types/bun' = 'latest'
  '@types/node' = '26.1.0'
  fast-check = '4.8.0'
  globals = '17.7.0'
  knip = '6.24.0'
  oxfmt = '0.57.0'
  oxlint = '1.72.0'
  sharp = '0.35.3'
  tailwindcss = '4.3.2'
  tslib = '2.8.1'
  vite = '8.1.3'
  # @config-manager:end dev_dependencies

[engines]
  # @config-manager:start engines
  bun = '>=1.1.0'
  # @config-manager:end engines

[peerDependencies]
  # @config-manager:start peer_dependencies
  typescript = '^6.0.3'
  # @config-manager:end peer_dependencies

[scripts]
  build = 'vite build'
  'build:images' = 'bun run scripts/optimize-images.ts'
  'build:videos' = 'bash scripts/transcode-videos.sh'
  dev = 'vite'
