# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# pinact - https://github.com/suzuki-shunsuke/pinact
version: 3
min_age:
  # threshold in days
  value: 7
  # also run the passive audit on every `pinact run` (extra GitHub API calls)
  always: true
separator: " # "
files:
  - pattern: ".github/workflows/*.yml"
  - pattern: ".github/workflows/*.yaml"
  - pattern: "action.yml"
  - pattern: "action.yaml"
  - pattern: "*/action.yml"
  - pattern: "*/action.yaml"
  - pattern: "*/*/action.yml"
  - pattern: "*/*/action.yaml"
  - pattern: "*/*/*/action.yml"
  - pattern: "*/*/*/action.yaml"

  # Config manager sources
  - pattern: "configs/stubs/.github/workflows/*.yml"
  - pattern: "configs/stubs/.github/workflows/*.yaml"
  - pattern: "configs/templates/.github/workflows/*.yml"
  - pattern: "configs/templates/.github/workflows/*.yaml"

rules:
  - min_age: 0
    conditions:
      - expr: |
          ActionName matches "step-security/harden-runner"
      - expr: |
          ActionName matches "github/codeql-action"
